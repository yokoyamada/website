<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yoko Yamada — Site en cours de construction</title>
    <meta name="description" content="Le site de Yoko Yamada est en cours de construction.">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: #f7fbfe;
            color: #16303f;
            font-family: Georgia, "Times New Roman", serif;
            text-align: center;
        }
        h1 { margin: 0; font-size: clamp(2.2rem, 8vw, 3.6rem); font-weight: normal; letter-spacing: 0.02em; }
        .rule { width: 48px; height: 2px; margin: 1.4rem auto; background: #8cc3e6; border: 0; }
        p { margin: 0.3rem 0; font-size: clamp(1.05rem, 3.5vw, 1.25rem); color: #4d6878; }
        p[lang="en"] { font-size: 0.95rem; font-style: italic; }
    </style>
</head>
<body>
    <main>
        <h1>Yoko Yamada</h1>
        <hr class="rule">
        <p>Site en cours de construction</p>
        <p lang="en">Website under construction</p>
    </main>
</body>
</html>
